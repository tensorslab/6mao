<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>6mao Dev</title>
    <style>
      :root {
        color: #2c2118;
        background:
          radial-gradient(circle at 20% 20%, #ffe0a3, transparent 30%),
          linear-gradient(145deg, #fff7e8, #f4d7c5 58%, #b8d9ca);
        font-family: 'Segoe UI', system-ui, sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        max-width: 560px;
        padding: 32px;
        border: 1px solid rgb(255 255 255 / 70%);
        border-radius: 28px;
        background: rgb(255 255 255 / 78%);
        box-shadow: 0 24px 80px rgb(44 33 24 / 16%);
        backdrop-filter: blur(18px);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 32px;
      }

      p {
        line-height: 1.7;
      }

      a {
        display: inline-block;
        margin: 8px 8px 0 0;
        padding: 10px 14px;
        border-radius: 999px;
        background: #2c2118;
        color: white;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>6mao 开发入口</h1>
      <p>Electron 应用包含两个渲染页面。浏览器预览时请打开下面的页面；完整桌面行为请使用 <code>pnpm dev</code>。</p>
      <a href="/src/renderer/chat-window/index.html">聊天窗口预览</a>
      <a href="/src/renderer/pet-window/index.html">桌宠窗口预览</a>
    </main>
  </body>
</html>
